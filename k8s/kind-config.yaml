# One-node kind cluster for the KubeRay side. scripts/train-k8s.sh replaces the DATA_DIR placeholder with the
# absolute path of the host's .data/k8s, which becomes /data on the node (the RayJob's hostPath).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: __DATA_DIR__
        containerPath: /data
