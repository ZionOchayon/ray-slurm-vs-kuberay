name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, to catch rot such as an upstream image or wheel being removed (FR-32).
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slurm:
    # Sized for the private-repo runner (2 vCPU, 7 GB design target): docs/SPEC.md NFR-04.
    # arm64 runners are free only for public repos, so the arm64 entry (FR-30) runs once it is public.
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(github.event.repository.private && '["ubuntu-24.04"]' || '["ubuntu-24.04", "ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # bash -e ignores the status of a negated command, so negative checks use explicit `if`.
      - name: "Hygiene: pins"
        run: |
          if grep -nE '[:@]latest\b' versions.env slurm/Dockerfile slurm/docker-compose.yml .github/workflows/*.yml; then exit 1; fi
          test "$(grep -c '@sha256:' versions.env)" -ge 2

      - name: "Hygiene: line endings"
        run: if git ls-files --eol | grep 'i/crlf'; then exit 1; fi

      - name: "Hygiene: license"
        run: grep -q 'Apache License' LICENSE && grep -q slurm-docker-cluster NOTICE && grep -q MIT slurm/LICENSE.slurm-docker-cluster

      - name: "Hygiene: banned phrases"
        run: if grep -niE 'production[- ](grade|ready)|enterprise[- ]grade|scales to' README.md; then exit 1; fi

      - name: "Hygiene: commit emails"
        # GitHub's own merge commits use noreply@github.com as committer.
        run: |
          bad=$(git log --format='%ae%n%ce' | sort -u | grep -vE '(@users\.noreply\.github\.com|^noreply@github\.com)$' || true)
          if [ -n "$bad" ]; then echo "non-noreply commit emails found:"; echo "$bad"; exit 1; fi

      - name: Preflight negative
        run: |
          if make up MIN_MEM_GIB=1024 > preflight.log 2>&1; then cat preflight.log; exit 1; fi
          cat preflight.log
          grep -q 'preflight: engine memory' preflight.log

      - name: Up
        run: make up

      - name: Metrics up (FR-50)
        run: make metrics-up

      - name: Shared /data probe
        run: |
          docker exec slurm-cpu-worker-1 sh -c 'echo ok > /data/.probe'
          docker exec slurm-cpu-worker-2 grep -qx ok /data/.probe

      - name: Train
        run: make train-slurm EPOCHS=2 RUN=ci-${{ github.run_id }}

      - name: Verify
        run: |
          make verify RUN=ci-${{ github.run_id }}
          if docker exec slurmctld test -e /data/datasets; then echo "synthetic run created /data/datasets"; exit 1; fi

      - name: Events (FR-13)
        run: |
          test "$(docker exec slurmctld grep -c '"event": "epoch_end"' /data/ray_results/ci-${{ github.run_id }}/events.jsonl)" -eq 2
          for e in driver_start first_step run_end; do
            docker exec slurmctld grep -q "\"event\": \"$e\"" /data/ray_results/ci-${{ github.run_id }}/events.jsonl
          done

      - name: Resume (FR-12)
        run: |
          make train-slurm EPOCHS=3 RUN=ci-${{ github.run_id }}
          make verify RUN=ci-${{ github.run_id }}
          docker exec slurmctld grep -q 'restored epoch=1' "/data/logs/ci-${{ github.run_id }}-$(cat .runs/ci-${{ github.run_id }}.jobid).out"

      - name: Manual launcher (FR-23)
        run: |
          make train-slurm LAUNCHER=manual EPOCHS=1 RUN=ci-manual-${{ github.run_id }}
          make verify RUN=ci-manual-${{ github.run_id }}

      - name: Metrics check (FR-50, FR-52, FR-53)
        run: |
          # Long enough (about half a minute of training) for Ray to export and Prometheus to scrape.
          make train-slurm EPOCHS=3 SAMPLES=60000 RUN=ci-metrics-${{ github.run_id }}
          make metrics-check

      - name: Results table (SC-04)
        run: bash bench/summarize.sh --check README.md

      - name: Negative verify
        run: |
          docker exec slurmctld rm -rf /data/ray_results/ci-${{ github.run_id }}/checkpoint_epoch_001
          if make verify RUN=ci-${{ github.run_id }}; then exit 1; fi

      - name: Negative train
        run: if make train-slurm RUN=ci-neg-${{ github.run_id }} DATA=bogus; then exit 1; fi

      - name: Collect logs
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose -p slurm --env-file versions.env -f slurm/docker-compose.yml logs > artifacts/compose.log 2>&1 || true
          docker exec slurmctld tar -C /data -cf - logs ray_results > artifacts/data.tar || true
          docker stats --no-stream > artifacts/docker-stats.txt 2>&1 || true

      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: slurm-logs-${{ matrix.runner }}
          path: artifacts

      - name: Down
        if: always()
        run: make down

  kind:
    # KubeRay side (FR-22, FR-30). CPU requests are lowered so 1 head + 1 worker + the submitter fit
    # on the 2-vCPU private runner; limits and num-cpus stay at 2 (docs/NOTES.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      K8S_CPU_REQUEST: 200m
    steps:
      - uses: actions/checkout@v7.0.1

      # The Ray image is several GB and `kind load` stores a second copy inside the node, which does not
      # fit on the runner's free disk; drop preinstalled toolchains this job never uses.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install kind, kubectl, helm (pinned, sha256-checked)
        run: sudo DEST=/usr/local/bin bash scripts/install-k8s-tools.sh

      - name: Cluster and metrics up
        run: |
          set -a; . ./versions.env; set +a
          bash scripts/kind-cluster.sh
          make metrics-up SCHED=k8s

      - name: Train
        run: make train-k8s EPOCHS=3 SAMPLES=60000 RUN=ci-k8s-${{ github.run_id }}

      - name: Metrics check
        run: make metrics-check SCHED=k8s

      - name: Verify
        run: make verify SCHED=k8s RUN=ci-k8s-${{ github.run_id }}

      - name: RayJob backoffLimit field (drill D2)
        run: kubectl --context kind-rayk8s explain rayjob.spec.backoffLimit

      - name: Collect logs
        if: failure()
        run: |
          mkdir -p artifacts
          kubectl --context kind-rayk8s get all -A -o wide > artifacts/get-all.txt 2>&1 || true
          kubectl --context kind-rayk8s describe rayjobs,rayclusters,pods > artifacts/describe.txt 2>&1 || true
          kubectl --context kind-rayk8s logs -n kuberay-system deploy/kuberay-operator > artifacts/operator.log 2>&1 || true
          cp -r .data/k8s/logs artifacts/ 2>/dev/null || true

      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: kind-logs
          path: artifacts

      - name: Down
        if: always()
        run: make down

  slinky:
    # Slurm on Kubernetes (SPEC §18, FR-43): SchedMD's slurm-operator in kind, the same sbatch file.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install kind, kubectl, helm (pinned, sha256-checked)
        run: sudo DEST=/usr/local/bin bash scripts/install-k8s-tools.sh

      - name: Up
        run: |
          make up-slinky
          make metrics-up SCHED=slinky

      - name: Train
        run: make train-slinky EPOCHS=3 SAMPLES=60000 RUN=ci-slinky-${{ github.run_id }}

      - name: Metrics check
        run: make metrics-check SCHED=slinky

      - name: Verify
        run: make verify SCHED=slinky RUN=ci-slinky-${{ github.run_id }}

      - name: Collect logs
        if: failure()
        run: |
          mkdir -p artifacts
          kubectl --context kind-rayk8s get all -A -o wide > artifacts/get-all.txt 2>&1 || true
          kubectl --context kind-rayk8s -n slurm describe pods > artifacts/describe-slurm.txt 2>&1 || true
          kubectl --context kind-rayk8s -n slinky logs deploy/slurm-operator > artifacts/operator.log 2>&1 || true
          for p in $(kubectl --context kind-rayk8s -n slurm get pods -o name 2>/dev/null); do
            kubectl --context kind-rayk8s -n slurm logs "$p" --all-containers > "artifacts/$(basename "$p").log" 2>&1 || true
          done
          cp -r .data/k8s/logs artifacts/job-logs 2>/dev/null || true
          cp .data/slinky-values.yaml artifacts/ 2>/dev/null || true

      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: slinky-logs
          path: artifacts

      - name: Down
        if: always()
        run: make down
